# Publish @ucsb-ampl/zasqua to npm on version tag.
#
# Triggered by a push of a semver tag (v1.0.0, v1.2.3, etc.). Runs the
# engine's full test suite before publishing to ensure a red build is
# never tagged to the registry.
#
# Authentication — trusted publishing (OIDC):
#   The package is published through npm trusted publishing. npmjs.com holds a
#   Trusted Publisher entry for this repository's release.yml workflow, and npm
#   exchanges the workflow's GitHub-issued OIDC identity token for a short-lived
#   publish credential at run time. There is no long-lived npm token — the
#   NPM_TOKEN secret the initial releases used has been retired.
#
#   id-token: write is required so GitHub mints the OIDC token (used both for
#   the trusted-publishing credential exchange and for --provenance).
#   setup-node's registry-url points npm at the public registry. Trusted
#   publishing needs npm 11.5.1+; Node 22 ships npm 10.x, so the upgrade step
#   below clears that bar before publishing.
#
# Version: v1.4.0

name: Publish to npm

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Upgrade npm for OIDC trusted publishing (needs 11.5.1+)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Publish to npm
        run: npm publish --provenance --access public

# Version: v1.4.0
